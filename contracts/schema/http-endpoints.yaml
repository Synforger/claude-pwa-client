# HTTP endpoints schema (= front <-> back contract、 真値)
#
# scope:
#   - 42 endpoint を全件列挙 (= interface-current.md § 1 起点)
#   - method / path / request body or query / response / 認証 / 不変条件
#
# 認証 (= auth field):
#   - tailnet: tailscale 越しのみ到達可能 (= 大半)
#   - localhost: 127.0.0.1 / ::1 のみ (= claude CLI hook 受け取り、 ADR-012 DNS rebinding 防御で Host allowlist)
#   - uid_check: 呼び出しプロセスの uid 検査 (= /task-output で /tmp/claude-{uid}/ 配下のみ許可)
#   - none: (= 現状なし、 将来公開 API 化時の予約)
#
# corr_id 伝播 (= ADR-012):
#   - frontend → backend: HTTP header `traceparent` (= W3C trace context) + 互換 `X-Correlation-Id`
#   - backend → SSE event: ContextVar で全 layer に伝播し event に付与
#   - backend → response header: `Server-Timing` で phase 別 timing 露出 (= ADR-012 中優先補強)

kind: http-endpoints
version: "1.0"
schema_version: "1.0"

endpoints:

  - method: GET
    path: /sessions
    description: "セッション一覧取得 (= the Claude tabs, then the API tabs: tabs with no Claude Code, backend/api_tabs/)"
    response:
      type: array
      items:
        type: object
        properties:
          sid:         { type: string }
          title:       { type: string }
          agent_id:    { type: string }
          account_id:  { type: string, nullable: true }
          notify_mode: { type: string }
          created_at:  { type: string }
          tier:        { type: string, nullable: true, description: "the tier the tab's agent started in (= its AGENT_TIER), else the tier a tier tab was placed for; null when not known" }
          tier_tab:    { type: string, nullable: true, description: "the tier a tier tab was placed for (= its new conversations start in it); null for other tabs" }
          asleep:      { type: boolean, description: "true while the tab's claude is put to sleep (= it starts again in the same conversation when the tab is opened or written to)" }
          account_on_wake: { type: string, nullable: true, description: "for a sleeping tab, the account it runs on once it is woken (= what the account fallback decides when it wakes it, which can differ from account_id); null for a tab that is awake" }
          kind:        { type: string, enum: [api], description: "api = a tab with no Claude Code whose conversation a program outside the client writes to a record file and the client only shows (id api_<name>, account_id = its wallet, tier null, never asleep). A Claude tab's row has no kind" }
          context_tokens: { type: integer, nullable: true, description: "API tabs only: how much of the context the conversation holds. A tab of api_tabs counts it from its record (= input_tokens + cache_read_input_tokens + cache_creation_input_tokens of the last answer that carries a usage); a tab an api_tab_sources file lists has the amount its program wrote (0 right after the program rolled the conversation over). null when there is none, never 0 for none" }
          context_window: { type: integer, nullable: true, description: "API tabs only: the size of the context window the tab's program says (api_tab_sources); null for a tab of api_tabs, or when the program says none" }
        required: [sid, title, agent_id]
    response_kind: json
    auth: tailnet
    invariants:
      - "返却順は updated_at 降順"
      - "削除済 session は含まない"
    implementation: backend/routes/sessions.py

  - method: GET
    path: /sessions/overview
    description: "全セッションの作業中 / 最後に見た時刻 / 入力待ち / 階層 / 眠り / 口座を 1 回で返す (= stream の overview と同じ中身)"
    response:
      type: object
      description: "sid → { busy, last_seen_at, waiting_input, tier, asleep, account_id, fallback_from, account_pinned, account_on_wake }。 the rows of the API tabs (= the same ids as GET /sessions) have the same keys plus kind (= api), title, context_tokens and context_window, and busy, waiting_input and asleep are always false"
    response_kind: json
    auth: tailnet
    invariants:
      - "中身は /stream/unified の overview channel と同じ builder (= _build_sessions_overview)"
      - "the ids of the API tabs come from the same table as GET /sessions (backend/api_tabs/); if the two disagreed the screen would fetch the list again for ever"
    implementation: backend/routes/overview.py

  - method: POST
    path: /sessions
    description: "セッション新規作成"
    request_body:
      type: object
      required: [agent_id]
      properties:
        agent_id:   { type: string }
        title:      { type: string }
        account_id: { type: string, nullable: true }
    response:
      type: object
      properties:
        sid: { type: string }
      required: [sid]
    response_kind: json
    auth: tailnet
    invariants:
      - "sid は server 採番 (= UUID v4)"
      - "agent_id 不正は 400"
    implementation: backend/routes/sessions.py

  - method: PATCH
    path: /sessions/{sid}
    description: "title / notify_mode 更新"
    request_body:
      type: object
      properties:
        title:       { type: string }
        notify_mode: { type: string, description: "always / mentions / never" }
    response_kind: json
    auth: tailnet
    invariants:
      - "title と notify_mode のみ更新可、 他 field は無視"
      - "存在しない sid は 404"
    implementation: backend/routes/sessions.py

  - method: POST
    path: /sessions/{sid}/fork
    description: "メッセージから分岐 (= 過去 uuid から新 session を派生)"
    request_body:
      type: object
      properties:
        from_uuid: { type: string, description: "分岐起点" }
      required: [from_uuid]
    response:
      type: object
      properties:
        sid: { type: string, description: "新 session id" }
      required: [sid]
    response_kind: json
    auth: tailnet
    invariants:
      - "from_uuid 不在は 404、 無ければ 400"
      - "fork lineage は parent_id 保持、 resume_session_id は落とす (= fork 初回役目終了)"
      - "新 session の account_id は親と同じ (= lineage の置き場所と spawn 先を必ず揃える)"
    implementation: backend/routes/sessions.py

  - method: POST
    path: /sessions/{sid}/account
    description: "同じタブのまま口座を移して会話を続ける (= 題も id も変わらない)"
    request_body:
      type: object
      properties:
        account_id: { type: string, description: "移し先 account" }
      required: [account_id]
    response:
      type: object
      properties:
        id: { type: string }
        account_id: { type: string }
      required: [id, account_id]
    response_kind: json
    auth: tailnet
    invariants:
      - "未知の account_id は 400"
      - "今の口座 (= account_id 無しは既定の口座) と同じなら何もしない"
      - "会話は末尾の切れ目まで移し先の projects dir に書き、 タブの account_id と resume_session_id をそれに揃えてから同じタブを立て直す"
      - "切れ目がまだ無ければ 400 で、 タブには触らない"
    implementation: backend/routes/sessions.py

  - method: POST
    path: /sessions/{sid}/restart
    description: "claude プロセス kill + 再 spawn"
    response:
      type: object
      properties:
        ok:     { type: boolean }
        reason: { type: string }
      required: [ok]
    response_kind: json
    auth: tailnet
    invariants:
      - "再 spawn 後の new claude_sid は SessionStart hook で confirm_bind 自動更新"
      - "tmux の窓を消す (= claude に HUP) → claude が終わるまで最大 5s 待つ → 残っていれば KILL。 次の claude は前の claude が終わってから立てる"
    implementation: backend/routes/sessions.py

  - method: GET
    path: /sessions/{sid}/history
    description: "直近 claude_sid 履歴 (= 最新 3 件)"
    response:
      type: object
      properties:
        entries:
          type: array
          items:
            type: object
            properties:
              ended_at:   { type: string }
              claude_sid: { type: string }
              jsonl_path: { type: string }
    response_kind: json
    auth: tailnet
    invariants:
      - "件数上限 3、 古いものから drop"
      - "debug 用途、 通常 UI からは叩かない"
    implementation: backend/routes/sessions.py

  - method: DELETE
    path: /sessions/{sid}
    description: "セッション完全削除 + JSONL GC"
    response_kind: json
    auth: tailnet
    invariants:
      - "削除順序: kill claude → unbind jsonl → JSONL file delete → session metadata delete"
      - "途中失敗時は session metadata 残し再試行可能に"
    implementation: backend/routes/sessions.py

  - method: POST
    path: /sessions/{sid}/seen
    description: "今このタブを見た marker (= 全端末に sync)"
    response_kind: json
    auth: tailnet
    invariants:
      - "/views/ws 接続中なら冪等、 接続なしでも seen 記録"
      - "未読カウンタを 0 にリセット"
      - "an API tab's id is accepted too (= the screen calls this each time it opens a tab); an unknown id is 404"
    implementation: backend/routes/sessions.py

  - method: GET
    path: /agents
    description: "session 作成時の agent 選択肢"
    response:
      type: array
      items:
        type: object
        properties:
          id:           { type: string }
          display_name: { type: string }
        required: [id, display_name]
    response_kind: json
    auth: tailnet
    invariants:
      - "config.json の agents キーから配信"
      - "順序は config 定義順を保持"
    implementation: backend/routes/accounts.py

  - method: GET
    path: /accounts
    description: "OAuth account 選択肢"
    response:
      type: array
      items:
        type: object
        properties:
          id:           { type: string }
          display_name: { type: string }
          is_default:   { type: boolean, description: "account_id 未設定の session と等価な account (= env に CLAUDE_CONFIG_DIR を持たない最初のもの)" }
        required: [id, display_name, is_default]
    response_kind: json
    auth: tailnet
    invariants:
      - "claude CLI 由来 (= ~/.claude/.credentials.json) を読み列挙"
      - "is_default が true になるのは高々 1 件 (= 0 件もあり得る)"
    implementation: backend/routes/accounts.py

  - method: POST
    path: /accounts/{account}/continue
    description: "口座の止める線で止まったタブを続ける (= その口座の held_at が付いたタブ全部に続けての連絡を送って起こし、 印を消す)"
    response:
      type: object
      properties:
        continued: { type: array, items: { type: string }, description: "続けたタブの id" }
        failed:    { type: array, items: { type: string }, description: "連絡が届かず、 印が残ったタブの id" }
      required: [continued, failed]
    response_kind: json
    auth: tailnet
    invariants:
      - "使用率がまだ今日の線以上なら 409 (code = still_at_line)、 何も送らず印も消さない"
      - "設定に無い口座は 404 (code = unknown_account)"
    implementation: backend/routes/account_hold.py

  - method: GET
    path: /settings
    description: "設定の画面が出す値 (= 口座の使用率と線、 止まったタブの数、 エージェントごとの眠りと入れ替え、 通知の題、 子の上限、 この機械の状態)"
    response:
      type: object
      properties:
        accounts:
          type: array
          items:
            type: object
            properties:
              id:             { type: string }
              display_name:   { type: string }
              is_default:     { type: boolean }
              usage:          { type: object, nullable: true, description: "five_hour_pct / five_hour_resets_at / seven_day_pct / seven_day_resets_at。 使用率の行が無い口座は null" }
              mode:           { type: string, description: "fallback = タブを逃げ先へ移す / hold = 区切りで止める / none" }
              fallback:       { type: object, nullable: true, description: "to / to_display_name / at_pct / ahead_pct (先回りの幅、 0 = 先回りしない) / seven_day_at_pct / seven_day_today_pct" }
              hold:           { type: object, nullable: true, description: "five_hour_at_pct (5 時間の線、 無ければ null) / seven_day_at_pct (曜日 → 線) / today_pct (今日の 7 日の線、 無ければ null)" }
              held_count:     { type: integer }
              tabs:           { type: object, description: "その口座で動くタブの数 (total / running = 眠っていない / pinned = 固定 / held = 線で止まっている)" }
              can_continue:   { type: boolean, description: "止まったタブが在り、 使用率が今日の線を下回っている (= 続けられる)" }
              pinned_tabs:    { type: array, items: { type: object, properties: { id: { type: string }, title: { type: string } } } }
            required: [id, display_name, mode, held_count, tabs, can_continue, pinned_tabs]
        agents:
          type: array
          items:
            type: object
            properties:
              id:            { type: string }
              display_name:  { type: string }
              sleep_minutes: { type: integer, nullable: true }
              sleep_pressure_minutes: { type: integer, nullable: true, description: "メモリの逼迫の間に眠らせるまでの分数。 null = 早く眠らせない" }
              rollover:      { type: object, description: "working_context_pct / idle_context_pct / idle_minutes (書いていなければ null)" }
            required: [id, display_name, rollover]
        child_sessions_max:   { type: integer, nullable: true, description: "1 つのタブが同時に持てる子のタブの数。 null = 上限なし" }
        notification_title:   { type: string }
        machine:              { type: object, description: "version / backend_started_at / loop_stall ({ stood_still_sec, back_at } か null)" }
        limits:               { type: object, description: "weekdays / line_pct_min / line_pct_max / ahead_pct_min / ahead_pct_max / context_pct_min / context_pct_max / minutes_min" }
        api_accounts:
          type: array
          description: "the API wallets (= the setting api_accounts), read-only. They are not accounts: tabs are never moved to one, stopped by one or continued on one"
          items:
            type: object
            properties:
              id:           { type: string }
              display_name: { type: string }
              spend:        { type: object, nullable: true, description: "this month's spend (= month / spent / limit / currency / updated_at); null when the spend file is missing, unreadable or of another month (never 0)" }
            required: [id, display_name, spend]
        api_sources:
          type: array
          description: "the programs that list API tabs (= the setting api_tab_sources) with the settings each lets the screen change, in the order of the setting"
          items:
            type: object
            properties:
              id:      { type: string, description: "the source's name in api_tab_sources" }
              fields:  { type: array, description: "the fields the program declared (settings_fields of its tab list file): key / label / unit (or null) / min / max / step (or null) / default. Empty when the source declares no settings file" }
              values:  { type: object, description: "key → the value now: the settings file's own when it is a number, else the field's default" }
              problem: { type: string, nullable: true, enum: [no_settings, no_fields, settings_unreadable], description: "why the source offers nothing to change (null when it does): no settings file declared / no field declared by the program yet / a settings file the screen cannot read" }
              reason:  { type: string, nullable: true, description: "with settings_unreadable: why the file cannot be read" }
              tabs_unreadable: { type: string, nullable: true, description: "why the tab list file could not be read the last time it changed (the tabs it listed last are shown); null when it was read or is missing" }
            required: [id, fields, values, problem, reason, tabs_unreadable]
      required: [accounts, agents, child_sessions_max, notification_title, machine, limits]
    response_kind: json
    auth: tailnet
    invariants:
      - "値は今 backend が読んでいる設定 (= PUT /settings の後は書き換えた値)"
    implementation: backend/routes/settings.py

  - method: PUT
    path: /settings
    description: "設定の画面から、 許した欄だけを部分的に変える (= config.json と同じ形で、 変える欄だけを書く。 null はその欄を消す)"
    request_body:
      type: object
      description: "accounts.<口座>.fallback.at_pct / .fallback.ahead_pct / .fallback.seven_day_at_pct.<曜日> / .hold.five_hour_at_pct / .hold.seven_day_at_pct.<曜日>、 agents.<エージェント>.sleep.minutes / .rollover の数の欄、 child_sessions_max、 notification_title だけ"
    response:
      type: object
      description: "変えた後の GET /settings と同じ中身"
    response_kind: json
    auth: tailnet
    invariants:
      - "許した欄以外を 1 つでも含む、 または値が読む側の規則に合わない時は 400 (code = settings_rejected、 params.reasons に欄ごとの理由)、 何も書かない"
      - "config.json の他の欄は、 値も並びも字下げも変えない (= 一時 file に書いてから置き換える)"
      - "書いた後に設定を読み直し、 次の見回りから新しい値で動く"
      - "config.json を読めない・書けない時は 500 (code = settings_not_written)"
    implementation: backend/routes/settings.py

  - method: PUT
    path: /settings/api-sources/{source}
    description: "set values of a program that lists API tabs, in the settings file the setting api_tab_sources.<source>.settings names, within the fields the program declared"
    request_body:
      type: object
      properties:
        values: { type: object, description: "key → number, for the keys to change only" }
      required: [values]
    response:
      type: object
      description: "the same as GET /settings after the change"
    response_kind: json
    auth: tailnet
    invariants:
      - "404 (code = api_source_unknown) when api_tab_sources has no such source"
      - "400 (code = settings_rejected, params.reasons one line per value) when the source declares no settings file, or a key is not a declared field, a value is not a finite number (true / false are not numbers), is outside min..max, or is off the grid of step from min; nothing is written"
      - "only the keys sent change: every other key keeps its value and place, and a field whose min and step are whole numbers is written as a whole number"
      - "the file is replaced in one step (a temporary file in the same folder, then a rename); a link is followed and the file it points to is replaced; the mode of the file is kept, and a new file is 0644"
      - "500 (code = settings_not_written) when the file is not a JSON object (it is not written over) or cannot be read or written"
    implementation: backend/routes/settings.py

  - method: GET
    path: /extensions
    description: "拡張 (= 別 repo のアプリを iframe で嵌める口) の一覧"
    response:
      type: array
      items:
        type: object
        properties:
          id:    { type: string, description: "^[a-z0-9][a-z0-9-]{0,31}$" }
          title: { type: string, description: "一覧の名前と iframe の title (= 未指定なら id)" }
          icon:  { type: string, description: "🧩 の一覧で名前の前に出す文字 (= 未指定なら 🧩)" }
          path:  { type: string, description: "/ext/<id>/ (= id から導出、 config には書かない)" }
          view:  { type: string, enum: [band, page], description: "開き方。 band = チャットの上の帯、 page = 入力欄の上を全部使う頁 (= 未指定なら band)" }
        required: [id, title, icon, path, view]
    response_kind: json
    auth: tailnet
    invariants:
      - "config.json の extensions キーから配信、 未設定なら空配列"
      - "順序は config 定義順を保持"
      - "不正な id / 重複 id の entry はその 1 件だけ捨てる (= 理由は起動時に warn)"
      - "view の書き損じは捨てずに band で返す (= 指摘は起動時に warn)"
      - "backend は拡張へ proxy しない (= 経路は Tailscale Serve、 到達判定は frontend の HEAD)"
    implementation: backend/routes/extensions.py

  - method: GET
    path: /file
    description: "HOME 配下ファイル読み取り (= deny list あり)"
    request_query:
      path: { type: string, description: "絶対 path or HOME 相対" }
    response:
      type: object
      properties:
        path:    { type: string }
        content: { type: string }
      required: [path, content]
    response_kind: json
    auth: tailnet
    invariants:
      - "HOME 配下外は 403"
      - "deny list (= .ssh / .aws / .env / secrets など、 鍵と token の置き場) 該当は 403"
      - "binary file (= 先頭 8000 byte に NUL を含む) は 415 で reject"
    implementation: backend/routes/files.py

  - method: GET
    path: /file/raw
    description: "HOME 配下の画像の生バイト (= ファイルプレビューの <img> 用)"
    request_query:
      path: { type: string, description: "絶対 path or HOME 相対" }
    response_kind: raw
    auth: tailnet
    invariants:
      - "png / jpg / jpeg / gif / webp のみ (= 拡張子で判定、 SVG は script を持てるので 415)"
      - "HOME 配下外 / deny list 該当は 403 (= /file と同じ境界)"
      - "10MB 超は 413"
      - "Content-Type は拡張子の画像型、 X-Content-Type-Options: nosniff"
    implementation: backend/routes/files.py

  - method: POST
    path: /file/os-open
    description: "会話とメモで押された path を、 backend の機械で Finder のダブルクリックと同じに開く (= フォルダは Finder、 file は既定のアプリ)"
    request_body:
      type: object
      required: [path]
      properties:
        path: { type: string, description: "押された path (= ~/... も可)" }
    response:
      type: object
      properties:
        opened: { type: boolean, description: "OS に渡したか。 Markdown・HTML・無い path・Mac でない時は false で、 画面は今までどおり開く" }
      required: [opened]
    response_kind: json
    auth: tailnet
    invariants:
      - "HOME 配下外 / deny list 該当は 403 (= /file と同じ境界)"
      - "走らせる物 (= .app・.command・.pkg など、 拡張子のあるフォルダ、 拡張子の無い実行の file) は開かず、 親の中で選んだ状態で見せる"
      - "開くアプリの無い file は、 親の中で選んだ状態で見せる"
      - "Markdown と HTML は OS に渡さない (= client が開く)"
    implementation: backend/routes/files.py

  - method: PUT
    path: /file
    description: "HOME 配下ファイル書き込み"
    request_body:
      type: object
      required: [path, content]
      properties:
        path:    { type: string }
        content: { type: string }
    response:
      type: object
      properties:
        ok: { type: boolean }
      required: [ok]
    response_kind: json
    auth: tailnet
    invariants:
      - "GET /file と同じ deny list 適用"
      - "存在しない親 dir は自動作成"
    implementation: backend/routes/files.py

  - method: GET
    path: /task-output
    description: "/tmp/claude-{uid}/ task 出力ログ取得"
    request_query:
      path: { type: string }
    response:
      type: object
      properties:
        path:    { type: string }
        content: { type: string }
      required: [path, content]
    response_kind: json
    auth: uid_check
    invariants:
      - "path は /tmp/claude-{uid}/ 配下のみ許可"
      - "uid 不一致 / 配下外は 403"
    implementation: backend/routes/files.py

  - method: GET
    path: /files/tree
    description: "ディレクトリツリー取得"
    request_query:
      path: { type: string, description: "起点 dir (= 省略時は HOME)" }
    response:
      type: object
      properties:
        path: { type: string }
        entries:
          type: array
          items:
            type: object
            properties:
              name:   { type: string }
              path:   { type: string }
              is_dir: { type: boolean }
            required: [name, path, is_dir]
    response_kind: json
    auth: tailnet
    invariants:
      - "HOME 配下外は 403"
      - "1 階層分のみ (= 再帰展開なし)"
    implementation: backend/routes/files.py

  - method: GET
    path: /favorites
    description: "お気に入りの一覧 (= 真値は利用者の置き場の favorites.txt、 1 行に 1 path)"
    response:
      type: object
      properties:
        favorites:
          type: array
          items:
            type: object
            properties:
              path:   { type: string, description: "絶対 path" }
              name:   { type: string, description: "path の末尾の名前" }
              is_dir: { type: boolean }
            required: [path, name, is_dir]
      required: [favorites]
    response_kind: json
    auth: tailnet
    invariants:
      - "file に持つのは path だけ。 name と is_dir は読むたびに実物から導く"
      - "実物を見に行くのは HOME 配下だけ (= HOME の外は is_dir=false)"
      - "path として読めない行は一覧に出さない。 同じ path は 1 件にまとめる"
    implementation: backend/routes/favorites.py

  - method: POST
    path: /favorites
    description: "お気に入りへ 1 件足す"
    request_body:
      type: object
      required: [path]
      properties:
        path: { type: string, description: "絶対 path or `~/...`" }
    response:
      type: object
      properties:
        favorites:
          type: array
          items:
            type: object
            properties:
              path:   { type: string }
              name:   { type: string }
              is_dir: { type: boolean }
            required: [path, name, is_dir]
      required: [favorites]
    response_kind: json
    auth: tailnet
    invariants:
      - "既に在る path は足さない (= 綴りが違っても同じ場所なら 1 件)"
      - "file の末尾に 1 行足すだけで、 他の行は書き換えない"
      - "絶対 path でも `~` 始まりでもない物、 改行を含む物は 400"
    implementation: backend/routes/favorites.py

  - method: DELETE
    path: /favorites
    description: "お気に入りから 1 件外す"
    request_query:
      path: { type: string, description: "絶対 path or `~/...`" }
    response:
      type: object
      properties:
        favorites:
          type: array
          items:
            type: object
            properties:
              path:   { type: string }
              name:   { type: string }
              is_dir: { type: boolean }
            required: [path, name, is_dir]
      required: [favorites]
    response_kind: json
    auth: tailnet
    invariants:
      - "その path の行だけを抜く (= path として読めない行は残す)"
      - "一覧に無い path を渡されても file は書き換えない"
    implementation: backend/routes/favorites.py

  - method: GET
    path: /sessions/{sid}/note
    description: "そのタブのメモと、 そのタブのトップページの場所を読む (= メモの真値は <階層の folder>/pages/<sid>/memo.md)"
    response:
      type: object
      properties:
        path:    { type: string, description: "メモの file の絶対 path (= エージェントには PWA_NOTE で渡る物)" }
        content: { type: string }
        page:    { type: string, nullable: true, description: "そのタブのトップページ (= メモの隣の index.html) の絶対 path。 まだ無ければ null" }
      required: [path, content, page]
    response_kind: json
    auth: tailnet
    invariants:
      - "file が無いタブは content が空文字 (= 404 にしない)"
      - "トップページは backend が、 タブの階層を記録した時にエージェントの雛形から作る (= 在る物は上書きしない)"
      - "存在しないタブは 404"
      - "1MB 超は 413"
      - "応答の ETag header がメモの版 (= 読んだ file の hash。 file が無いタブは空の file の版)"
    implementation: backend/routes/notes.py

  - method: PUT
    path: /sessions/{sid}/note
    description: "そのタブのメモを書く"
    request_body:
      type: object
      required: [content]
      properties:
        content: { type: string }
    response:
      type: object
      properties:
        path:    { type: string }
        content: { type: string }
      required: [path, content]
    response_kind: json
    auth: tailnet
    invariants:
      - "書くのはそのタブの file だけ (= 他のタブからは見えない)"
      - "content が空文字なら file ごと消す"
      - "存在しないタブは 404、 1MB 超は 413"
      - "If-Match に GET で読んだ版を付けた時、 file がその後に変わっていれば 412 (note_changed) で書かない。 付けない時は無条件に書く"
      - "応答の ETag header が書いた後の版"
      - "タブを消すと (= DELETE /sessions/{sid}) メモも消える"
    implementation: backend/routes/notes.py

  - method: GET
    path: /sessions/{sid}/subagents
    description: "Task subagent + Workflow run 一覧"
    response:
      type: object
      properties:
        subagents: { type: array }
        workflows: { type: array }
    response_kind: json
    auth: tailnet
    invariants:
      - "subagent は親 turn の tool_use_id 単位"
      - "workflow は run_id 単位"
    implementation: backend/routes/subagents.py

  - method: GET
    path: /sessions/{sid}/subagents/stream
    description: "subagent リアルタイム監視 SSE"
    response_kind: sse
    auth: tailnet
    invariants:
      - "新 subagent 起動 / 完了で event 配信"
      - "EventSource auto-reconnect 3s default"
    implementation: backend/routes/subagents.py

  - method: GET
    path: /sessions/{sid}/workflows/{run_id}/agents
    description: "Workflow run の agent 詳細"
    response:
      type: object
      properties:
        agents: { type: array }
    response_kind: json
    auth: tailnet
    invariants:
      - "run_id 不在は 404"
    implementation: backend/routes/subagents.py

  - method: GET
    path: /sessions/{sid}/subagents/{agent_id}/transcript
    description: "subagent transcript 全文 (= 通常 JSON、 -CC で SSE)"
    response:
      type: object
      properties:
        lines: { type: array, items: { type: string } }
    response_kind: json
    auth: tailnet
    invariants:
      - "agent_id 不在は 404"
      - "transcript は line 単位"
    implementation: backend/routes/subagents.py

  - method: POST
    path: /pty/{sid}/send
    description: "tmux send-keys 経由のテキスト送信"
    request_body:
      type: object
      properties:
        text:  { type: string }
        key:   { type: string, description: "send-keys 経由の特殊キー名" }
        enter: { type: boolean, description: "末尾 Enter 送信" }
    response:
      type: object
      properties:
        ok:         { type: boolean }
        delivered:  { type: boolean }
        incomplete: { type: boolean }
      required: [ok]
    response_kind: json
    auth: tailnet
    invariants:
      - "text と key は択一"
      - "delivered = JSONL line count 増分で判定 (= confirm.py)"
      - "15s timeout で incomplete=true"
      - "そのタブの会話がどこかで開いている間 (= どれかの画面が op=voice で宣言している / app の通話がつながっている) は、 本文 (= text + enter) の頭に [voice] の印を付けてから打つ。 / ! # で始まる本文と、 印の付いた本文はそのまま。 別のタブからの連絡と自動の入れ替えは backend の中から印の無い経路で打つ"
      - "頭に [voice] の印が付いた本文は、 turn の実行中なら先に Escape で止め、 claude が中断の行を書くか入力欄へ前の発話を戻すのを見届けてから (= 上限 3 秒、 過ぎても打つ)、 入力欄を消さずに後ろへ打つ (= 戻された発話と空白 1 つで区切り、 1 つの発話になる)。 停止の印 (= user_stopped) は付けない"
      - "本文の無い key=Escape は停止ボタン: すぐ打って返り、 claude が受け終えるのを見届けてから、 本文の送信と順番に入力欄を消す"
    implementation: backend/terminal/routes.py

  - method: POST
    path: /pty/{sid}/send-with-files
    description: "ファイル添付込みテキスト送信 (= multipart)"
    request_body:
      type: object
      description: "multipart/form-data: text + files[]"
    response:
      type: object
      properties:
        ok:          { type: boolean }
        saved_files: { type: array, items: { type: string } }
      required: [ok]
    response_kind: multipart
    auth: tailnet
    invariants:
      - "保存先 = uploads/tmp 配下"
      - "saved_files は backend 保存後の path 配列"
      - "会話が開いている間は、 本文と [添付ファイル: ...] の行を並べた後の頭に [voice] の印を付ける (= 写真だけの送信にも付く。 決まりは /pty/{sid}/send と同じ)"
    implementation: backend/terminal/routes.py

  - method: POST
    path: /sessions/{sid}/rollover
    description: "タブの中の claude が、 自分の会話を終了して新しい会話を起動し直すよう頼む (= multipart / urlencoded form)"
    request_body:
      type: object
      description: "form: text (= 新しい会話の最初の発話に入れる本文)"
    response:
      type: object
      properties:
        rolling: { type: boolean }
      required: [rolling]
    response_kind: json
    auth: localhost
    invariants:
      - "202 を返してからタブを終了する (= 呼び手は終了されるタブの中で動いている)"
      - "終了の後、 本文を封筒に入れた発話を最初の発話として新しい会話を起動する (= 1 行目は固定、 人の送信口 /pty/{sid}/send には付かない)"
      - "config の agent_message_check が在れば、 本文を「どの会話でもない宛先」 の名前 (= rollover:<sid>) で検査し、 0 以外で終われば 403 で返して終了しない"
    implementation: backend/routes/rollover.py

  - method: GET
    path: /sessions/{sid}/voice
    description: "そのタブが声を持つか (= agent の設定に voice が在るか) と、 言い方の印の一覧"
    response:
      type: object
      properties:
        enabled: { type: boolean }
        marks:   { type: array, items: { type: string }, description: "言い方の印の名前 (= 設定に書いた順。 最後に予約の印 mute。 声を持たなければ空)" }
        default: { type: string, description: "印の無い文の印 (= 印を 1 つも持たなければ空文字)" }
        listen:  { type: boolean, description: "人の声を聞き取るか (= 設定に voice.listen が在るか)" }
        turn:    { type: boolean, description: "言い終えを判定する model を持つか (= 設定に voice.listen.turn が在るか)" }
        conversation:
          type: object
          nullable: true
          description: "会話の間の取り方 (= 設定と調整の file の値、 書いていない項目は既定。 声を持たなければ null)"
          properties:
            pause_ms:  { type: integer, description: "声が途切れてから、 言い終えたかの判定に入るまでの無音 (ミリ秒)" }
            wait_ms:   { type: integer, description: "言い終えていない時に、 送るまで待つ無音 (ミリ秒。 声が途切れた時から)" }
            resume_ms: { type: integer, description: "言い終えた発話を送る前に待つ時間 (ミリ秒)。 この間に話し始めたら続きとつなげる。 0 なら待たない" }
            unfinished_endings: { type: array, items: { type: string }, description: "聞き取った文がこれで終わる時は、 wait_ms まで待つ" }
            interrupt: { type: boolean, description: "返事が鳴っている間も聞き、 話し始めたら返事を止めるか" }
          required: [pause_ms, wait_ms, resume_ms, unfinished_endings, interrupt]
        tuning_error: { type: string, description: "調整の file (= voice.tuning) を使えない理由 (= 使えている / 書いていなければ空文字)" }
      required: [enabled, marks, default, listen, turn, conversation, tuning_error]
    response_kind: json
    auth: tailnet
    invariants:
      - "agent の設定に voice が無い / 形が違うタブは enabled=false (= エラーにしない)"
      - "調整の file が無い / 読めない / 形が違う時は、 設定の値のまま答え、 理由を tuning_error に入れる"
      - "タブが無ければ 404 voice_unknown_session"
    implementation: backend/routes/voice.py

  - method: POST
    path: /sessions/{sid}/voice/utterances
    description: "agent の返事の文を、 声にする文の並びにする (= コード・表・path・URL を飛ばし、 文に切り、 文頭の印を剥がす)"
    request_body:
      type: object
      required: [text]
      properties:
        text: { type: string, description: "agent の返事の文 (= markdown のまま)" }
    response:
      type: object
      properties:
        utterances:
          type: array
          items:
            type: object
            properties:
              mark: { type: string, description: "その文の言い方の印 (= 文頭に印が無ければ既定の印)" }
              text: { type: string }
              values:
                type: object
                description: "印に添えた値 (= engine の問い合わせの値の名前 → 数。 添えていなければ空)"
                additionalProperties: { type: number }
            required: [mark, text, values]
      required: [utterances]
    response_kind: json
    auth: tailnet
    invariants:
      - "声にする物が無い返事は空の並び (= エラーにしない)"
      - "文頭の印は、 その行の終わりまで効く (= 行の中で別の印が出れば切り替わる)。 設定に無い名前の [..] は文として残る"
      - "予約の印 [mute] の行は声にしない (= 返さない。 行の終わりまで効き、 設定の marks に同じ名前が在っても予約が勝つ)"
      - "印に添えた値 (= [happy i=1.2 s=1.1]) は印と同じく行の終わりまで効く。 名前の違う値と範囲の外の値は values に入れない (= その文は印の値で言う。 backend の log に出す)"
      - "声を持たないタブは 409 voice_not_enabled、 text が文字列でなければ 400 voice_bad_request、 上限より長ければ 413 voice_text_too_long"
      - "音声合成の engine は呼ばない"
    implementation: backend/routes/voice.py

  - method: POST
    path: /sessions/{sid}/voice/synthesis
    description: "1 文を、 印の言い方で音にして返す (= 音声合成の engine が返した音をそのまま返す)"
    request_body:
      type: object
      required: [text]
      properties:
        text: { type: string, description: "声にする 1 文 (= utterances が返した文)" }
        mark: { type: string, description: "言い方の印 (= 省けば既定の印)" }
        values:
          type: object
          description: "印に添えた値 (= utterances が返した values。 省略可)"
          additionalProperties: { type: number }
    response_kind: raw
    auth: tailnet
    invariants:
      - "応答は engine が返した音 (= audio/wav)、 Cache-Control: no-store"
      - "engine が問い合わせに返した値へ、 設定の query、 その上に印の値、 その上に values を当てる (= engine が返した値に無い名前は送らない)"
      - "values のうち名前の違う物と範囲の外の物は使わない (= 断らずに印の値で言い、 backend の log に出す)。 values が組でなければ 400 voice_bad_request"
      - "印が speaker を持てば、 その文だけその声の番号で言う"
      - "設定に無い印は 400 voice_unknown_mark、 声にする文字が無ければ 400 voice_nothing_to_say、 上限より長ければ 413 voice_text_too_long (= どれも engine を呼ぶ前に返す)"
      - "engine に繋がらなければ 502 voice_engine_unreachable、 engine が断れば 502 voice_engine_failed (= params に step と status)"
    implementation: backend/routes/voice.py

  - method: POST
    path: /sessions/{sid}/voice/reading
    description: "1 文の読み (= engine が声にする時の拍のカナ) を返す (= 電話の会話が、 聞き取った文が自分の声かを、 書いた文字でなく声のとおりに見分ける)"
    request_body:
      type: object
      required: [text]
      properties:
        text: { type: string, description: "読みにする文" }
    response:
      type: object
      properties:
        reading: { type: string, description: "拍のカナをつなげた物 (= 間の無音は含めない)" }
      required: [reading]
    response_kind: json
    auth: tailnet
    invariants:
      - "engine の /audio_query に、 設定の声の番号で問い合わせる (= 音は作らない)"
      - "声を持たないタブは 409 voice_not_enabled、 text が無ければ 400 voice_bad_request、 声にする文字が無ければ 400 voice_nothing_to_say、 上限より長ければ 413 voice_text_too_long (= どれも engine を呼ぶ前に返す)"
      - "engine に繋がらなければ 502 voice_engine_unreachable、 engine が断れば 502 voice_engine_failed"
    implementation: backend/routes/voice.py

  - method: POST
    path: /sessions/{sid}/voice/transcription
    description: "録った音を、 聞き取りの engine で文にして返す (= 送るのは画面が普段の送信口で行う)"
    request_body:
      type: object
      description: "本文は録った音そのもの (= Content-Type は audio/…。 形式の変換は engine が行う)"
    response:
      type: object
      properties:
        text: { type: string, description: "聞き取った文 (= 1 行。 声が聞き取れなければ空文字)" }
      required: [text]
    response_kind: json
    auth: tailnet
    invariants:
      - "header X-Voice-Conversation が在れば、 その名前が会話の持ち主でない時は 409 voice_conversation_elsewhere (= 持ち主が居なければ、 その名前が持ち主になる)"
      - "engine の /inference へ multipart で渡す (= file と response_format=json、 設定に prompt が在れば prompt)"
      - "engine が区切りごとに挟む改行は、 空白 1 つにまとめる"
      - "声を持たないタブは 409 voice_not_enabled、 聞き取りを持たないタブは 409 voice_listen_not_enabled"
      - "Content-Type が audio/ でない / 本文が空なら 400 voice_bad_request、 上限より大きければ 413 voice_audio_too_large (= どれも engine を呼ぶ前に返す)"
      - "engine に繋がらなければ 502 voice_listen_unreachable、 engine が断る / 文を返さなければ 502 voice_listen_failed (= params に status)"
    implementation: backend/routes/voice.py

  - method: POST
    path: /sessions/{sid}/voice/interruption
    description: "話している途中の人の言葉が取れた: そのタブの turn の実行中なら、 話し終えるのを待たずに止める"
    response:
      type: object
      properties:
        stopped: { type: boolean, description: "止めたか (= turn の実行中でなければ false で、 何もしない)" }
      required: [stopped]
    response_kind: json
    auth: tailnet
    invariants:
      - "header X-Voice-Conversation が在れば、 その名前が会話の持ち主でない時は 409 voice_conversation_elsewhere"
      - "止め方は声の発話と同じ Escape (= 入力欄は消さず、 停止の印 user_stopped も付けない)。 停止ボタンの後は止めない"
      - "次の声の発話は Escape を打ち直さず、 止めた時に claude が入力欄へ戻した文の後ろへ打つ。 声でない本文が先に来たら、 止めた形は捨てる"
      - "声を持たないタブは 409 voice_not_enabled、 聞き取りを持たないタブは 409 voice_listen_not_enabled"
    implementation: backend/routes/voice.py

  - method: GET
    path: /sessions/{sid}/voice/turn-model
    description: "言い終えを判定する Smart Turn の model の file (= 設定の voice.listen.turn。 画面が受け取って、 画面の中で判定する)"
    response_kind: raw
    auth: tailnet
    invariants:
      - "応答は file の中身そのまま (= application/octet-stream)、 Cache-Control: no-cache (= ETag で確かめ直す)"
      - "聞き取りを持たないタブは 409 voice_listen_not_enabled、 設定に turn が無い / file が無ければ 404 voice_turn_model_missing"
    implementation: backend/routes/voice.py

  - method: POST
    path: /sessions/{sid}/voice/conversation
    description: "この画面で会話を開く (= そのタブの会話の持ち主をこの画面にする)"
    request_body:
      type: object
      required: [client]
      properties:
        client: { type: string, description: "画面が名乗る名前 (= 英数字と - _ の 64 文字まで。 画面を読み込むたびに作る)" }
    response:
      type: object
      properties:
        client: { type: string }
      required: [client]
    response_kind: json
    auth: tailnet
    invariants:
      - "後から開いた画面が持ち主になる (= 前の持ち主の音は transcription が 409 voice_conversation_elsewhere で断る)"
      - "持ち主は backend の memory にだけ在る (= 再起動で忘れる)"
      - "client の形が違えば 400 voice_bad_request、 聞き取りを持たないタブは 409 voice_listen_not_enabled"
    implementation: backend/routes/voice.py

  - method: DELETE
    path: /sessions/{sid}/voice/conversation
    description: "会話を閉じる (= 持ち主の画面からだけ)"
    request_body:
      type: object
      required: [client]
      properties:
        client: { type: string, description: "会話を開いた時に名乗った名前" }
    response:
      type: object
      properties:
        closed: { type: boolean, description: "閉じたか (= 別の画面が持っていれば false で、 そのまま)" }
      required: [closed]
    response_kind: json
    auth: tailnet
    invariants:
      - "持ち主でない名前からは閉じない (= closed=false)"
    implementation: backend/routes/voice.py

  - method: POST
    path: /sessions/{sid}/voice/call
    description: "電話の会話の接続を申し込む (= iPhone の app が WebRTC でつなぐ。 SDP の offer を渡し、 answer を受け取る。 つながった時から、 backend の中で声の会話が回る)"
    request_body:
      type: object
      description: "Pipecat の SmallWebRTC の offer (= sdp / type、 つなぎ直しの時は pc_id / restart_pc)"
      properties:
        sdp: { type: string }
        type: { type: string }
        pc_id: { type: string }
        restart_pc: { type: boolean }
      required: [sdp, type]
    response:
      type: object
      description: "SDP の answer (= sdp / type / pc_id)"
      properties:
        sdp: { type: string }
        type: { type: string }
        pc_id: { type: string }
      required: [sdp, type, pc_id]
    response_kind: json
    auth: tailnet
    invariants:
      - "声を持たないタブは 409 voice_not_enabled、 聞き取りを持たないタブは 409 voice_listen_not_enabled (= つなぐ前に返す)"
      - "電話の会話の部品 (= `voice-call` の追加の依存) が入っていなければ 501 voice_call_unavailable"
      - "query の volume (= 0 〜 2、 省けば 1) は、 その端末の声の大きさの倍率。 範囲の外なら 400 voice_bad_request"
      - "query の resume=1 は同じタブの通話のつなぎ直し (= app がマイクの入 / 切や端末の操作で掛け直す時)。 前の通話が閉じ終えるのを待ち、 鳴り終えていなかった文から言い直し、 閉じた後に届いた返事も声にする。 resume の無い通話は、 前の鳴り残しを捨てる"
      - "通話は 1 つのタブに 1 本で、 後から申し込んだ方が残る。 申し込みが来たら同じタブの前の通話は閉じ、 待っている間に同じタブへ後の申し込みが来た申し込みは、 通話を立てずに 409 voice_call_superseded"
      - "会話は通話ごとに別の process で動く (= backend 本体の他の仕事で音の送り出しを遅らせない)。 その process が answer を返せなければ 502 voice_call_failed (= params に reason)"
      - "電話が実際につながった時に、 その電話がタブの会話の持ち主になる (= 画面の会話と同じ決まり。 後から開いた画面が持てば、 電話は次の発話で切れる。 つながらないまま捨てられた申し込みは、 会話を取らない)"
      - "人の発話は、 声で聞いている印を付けて、 画面で打った時と同じ口でタブへ送る。 タブの返事は、 画面の声と同じ決まりで声にして電話へ返す"
    implementation: backend/routes/voice_call.py

  - method: POST
    path: /sessions/{sid}/voice/call/volume
    description: "そのタブの通話の声の大きさの倍率を変える (= 端末の画面のつまみ。 話している途中でもその場で効く)"
    request_body:
      type: object
      properties:
        volume: { type: number, description: "0 〜 2 (= 1 で engine の音のまま)" }
      required: [volume]
    response:
      type: object
      properties:
        calls: { type: integer, description: "倍率を伝えた通話の数 (= 通話が無ければ 0)" }
      required: [calls]
    response_kind: json
    auth: tailnet
    invariants:
      - "volume が数でない / 0 〜 2 の外なら 400 voice_bad_request"

  - method: PATCH
    path: /sessions/{sid}/voice/call
    description: "電話の会話の経路の候補 (= ICE candidate) を足す"
    request_body:
      type: object
      description: "Pipecat の SmallWebRTC の patch"
      properties:
        pc_id: { type: string }
        candidates: { type: array, items: { type: object } }
      required: [pc_id, candidates]
    response:
      type: object
      properties:
        status: { type: string }
      required: [status]
    response_kind: json
    auth: tailnet
    invariants:
      - "知らない pc_id (= つないでいない / もう終わった接続) は 404 voice_call_unknown"
    implementation: backend/routes/voice_call.py

  - method: POST
    path: /agent-messages
    description: "タブの中の claude から、 別のタブの claude への連絡 (= multipart / urlencoded form)"
    request_body:
      type: object
      description: "form: to (= 宛先のタブの id か名前。 別の機械のタブは <相手の名前>:<タブ>) + from (= 送り主のタブの id) + text (= 本文)"
    response:
      type: object
      properties:
        ok:        { type: boolean }
        delivered: { type: boolean }
        to:        { type: string, description: "届け先のタブの id (= 別の機械のタブは <相手の名前>:<id>)" }
        operator_said: { type: boolean, description: "送り主のタブで人が打った発話を封筒に入れたか" }
        kept:      { type: boolean, description: "宛先が口座の止める線で止まっていて動ける口座が無いので、 起こさずに預かったか (= 動ける口座ができた時に届く)" }
      required: [ok, to, operator_said]
    response_kind: json
    auth: localhost
    invariants:
      - "本文に送り主を名乗る封筒を付けて届ける (= 1 行目は固定、 人の送信口 /pty/{sid}/send には付かない)"
      - "宛先で claude が動いていない時は、 人の操作と同じに起動してから届ける (= tmux が無ければ画面で開いた時の起動、 pane が shell ならタブの階層 (= 無ければ normal) で新しい会話、 子のタブと起動ラッパの無いエージェントは前の会話を開き直す)。 起動ラッパが無く開き直す会話も無いタブには 409 agent_message_receiver_not_running を返す"
      - "起動が間に合わなければ、 打たずに 409 agent_message_receiver_not_ready を返す"
      - "宛先が口座の止める線で止まっていて (= held_at があり眠っている)、 動ける口座が無い時は、 起こさずに預かって kept=true を返す。 動ける口座ができた時と、 タブが起きた時に、 来た順に届ける"
      - "config の agent_message_check が 0 以外で終われば届けず、 理由を 403 で返す"
      - "送り主のタブで最後に端末から入った発話が人の物なら <operator-said> として封筒に入れる (= agent_message_operator_check が 0 以外なら入れずに届ける)"
      - "宛先が <相手の名前>:<タブ> で、 その名前が config の agent_message_peers に在れば、 検査 (= 宛先の名前をそのまま渡す) を通してから相手の backend へ渡す。 人の発話は、 頼まれても付けない"
      - "相手の設定に accounts が在れば、 その account のタブからだけ送れる"
      - "a receiver that is an API tab (= its id or title is in the table of backend/api_tabs/) is not delivered to: 409 agent_message_api_tab (= no Claude Code would read it)"
    implementation: backend/routes/agent_messages.py

  - method: POST
    path: /sessions/{session_id}/ask
    description: "a program on this machine types a text into a tab whose agent has ask: true, and gets the last answer of that turn (= multipart / urlencoded form; the path takes the tab's id or name)"
    request_body:
      type: object
      description: "form: text (= what is typed) + fresh (= true types /clear first) + timeout_sec (= the wait for the answer after the typing, default 180, at most 3600)"
    response:
      type: object
      properties:
        ok:     { type: boolean }
        id:     { type: string, description: "the asked tab's id" }
        answer: { type: string, description: "the last answer of the turn (= last_assistant_message of the Stop hook)" }
      required: [ok, id, answer]
    response_kind: json
    auth: localhost
    invariants:
      - "only a tab whose agent has ask: true is typed into; any other is 403 ask_not_allowed, and nothing is typed"
      - "one ask at a time per tab (= 409 ask_in_progress); a tab in the middle of a turn is 409 ask_tab_busy, and nothing is typed"
      - "the text goes in as plain input, with no envelope; a sleeping tab or one with no claude is started first, as a message would start it"
      - "a turn that has not ended within timeout_sec of the typing is stopped with Escape and answered 504 ask_timeout"
      - "a failure carries an ask_* code in detail.code (= ask_not_ready: nothing was asked; ask_unconfirmed: the text may have been typed)"
    implementation: backend/routes/ask.py

  - method: POST
    path: /tickets
    description: "a tab opens a ticket, the one file that a request crossing tabs is kept in (= multipart / urlencoded form)"
    request_body:
      type: object
      description: "form: from (= the opening tab's id) + title + text + operator_said (= true puts the operator's last words in that tab into the ticket, as the conversation's record has them)"
    response:
      type: object
      properties:
        ok:            { type: boolean }
        id:            { type: string, description: "<machine>-<YYMMDD>-<NN>" }
        place_outside: { type: boolean, description: "true when the ticket is kept outside every boundary of the guard" }
        operator_said: { type: boolean, description: "whether the operator's words went in as the second line" }
        operator_said_left_out: { type: string, description: "why the words asked for did not go in (= no_operator_words)" }
      required: [ok, id, place_outside, operator_said]
    response_kind: json
    auth: localhost
    invariants:
      - "the place of the ticket is decided once, when it opens, by the guard's ticket_place_check (= none configured: the place outside every boundary); it is never moved"
      - "the first lines are judged by ticket_write_check before anything is written; a refusal is 403 ticket_refused, a check that cannot run 503 ticket_check_failed"
      - "a place that does not fit one folder is 409 ticket_place_split and an undecidable one 503 ticket_place_unknown; nothing is written"
      - "the operator's words come from the tab's conversation record, never from the form"
      - "index.json holds each ticket's place key, holder, opener, state and what it wants, and no title, text or folder path"
    implementation: backend/routes/tickets.py

  - method: POST
    path: /tickets/{ticket}/entries
    description: "a tab adds what it did to a ticket (= form: from, text); the holder does not change"
    request_body:
      type: object
      description: "form: from (= the writing tab's id) + text"
    response:
      type: object
      properties:
        ok:     { type: boolean }
        id:     { type: string }
        status: { type: string, description: "open, waiting-operator or closed" }
      required: [ok, id, status]
    response_kind: json
    auth: localhost
    invariants:
      - "a tab that has not read the whole boundary of the ticket's place is refused with 403 ticket_outside_place (ticket_covers_check)"
      - "the text is judged by ticket_write_check; lines are only ever added, and two added at once do not mix"
      - "a closed ticket takes no line (409 ticket_closed); an id that is not in the index is 404 ticket_unknown; an empty text is 400 ticket_empty"
    implementation: backend/routes/tickets.py

  - method: POST
    path: /tickets/{ticket}/asks
    description: "a tab puts a ticket in front of the operator (= form: from, kind, text, recommend)"
    request_body:
      type: object
      description: "form: from + kind (= decide, mac or report) + text + recommend (optional; the operator may take it as it stands)"
    response:
      type: object
      properties:
        ok:     { type: boolean }
        id:     { type: string }
        status: { type: string, description: "waiting-operator" }
      required: [ok, id, status]
    response_kind: json
    auth: localhost
    invariants:
      - "the ticket waits for the operator from here (waiting-operator) and the index says what it wants"
      - "an unknown kind is 400 ticket_bad_kind; the same refusals as an entry apply"
    implementation: backend/routes/tickets.py

  - method: POST
    path: /tickets/{ticket}/close
    description: "a tab closes a ticket (= form: from, text optional); the ticket stays as the record of the request"
    request_body:
      type: object
      description: "form: from + text (optional last word)"
    response:
      type: object
      properties:
        ok:     { type: boolean }
        id:     { type: string }
        status: { type: string, description: "closed" }
      required: [ok, id, status]
    response_kind: json
    auth: localhost
    invariants:
      - "a closed ticket is not closed again (409 ticket_closed); the same refusals as an entry apply"
    implementation: backend/routes/tickets.py

  - method: POST
    path: /tickets/{ticket}/pass
    description: "a tab hands a ticket to another tab on this machine (= form: from, to = the tab's id or name): the holder moves and the tab is told in one line"
    request_body:
      type: object
      description: "form: from + to"
    response:
      type: object
      properties:
        ok:   { type: boolean }
        id:   { type: string }
        to:   { type: string, description: "the receiving tab's id" }
        kept: { type: boolean, description: "the tab is stopped by the account hold, so the line is kept and delivered once an account is clear" }
      required: [ok, id, to]
    response_kind: json
    auth: localhost
    invariants:
      - "both tabs must have read the ticket's place's boundary (403 ticket_outside_place)"
      - "a ticket waiting for the operator is not handed over (409 ticket_waiting_operator); a tab on another machine is 501 ticket_peer_not_yet"
      - "the tab is told through the way messages between tabs go (= the usual envelope, with the ticket's id as an attribute of its tag, the usual first line); the ticket changes only after that delivery"
    implementation: backend/routes/tickets.py

  - method: GET
    path: /tickets/{ticket}
    description: "the ticket as the tab reader may read it (= query: reader = the reading tab's id): every line by time"
    request_query:
      reader: { type: string, description: "the reading tab's id" }
    response:
      type: object
      properties:
        ok:            { type: boolean }
        id:            { type: string }
        status:        { type: string }
        wants:         { type: string, nullable: true, description: "decide, mac or report; null when the ticket asks nothing of the operator" }
        holder:        { type: string, description: "the tab that holds the ticket" }
        opener:        { type: string, description: "the tab that asked first" }
        place_outside: { type: boolean }
        entries:       { type: array, items: { type: object }, description: "the lines; one the reader may not read is {kind, at, hidden: true, text} (= ticket_read_check)" }
      required: [ok, id, status, holder, opener, entries]
    response_kind: json
    auth: localhost
    invariants:
      - "each line is judged for the reader by ticket_read_check; a line not let through, or a check that does not run, shows only its kind and time"
    implementation: backend/routes/tickets.py

  - method: GET
    path: /tickets
    description: "every ticket with its title and state, for the operator's screen"
    response:
      type: object
      properties:
        ok:      { type: boolean }
        tickets:
          type: array
          items:
            type: object
            properties:
              id:            { type: string }
              title:         { type: string, nullable: true, description: "read from the ticket's place; null when the place is not known" }
              opened_at:     { type: string, nullable: true }
              status:        { type: string }
              wants:         { type: string, nullable: true }
              holder:        { type: string }
              opener:        { type: string }
              place_outside: { type: boolean }
            required: [id, status, holder, opener, place_outside]
      required: [ok, tickets]
    response_kind: json
    auth: localhost
    invariants:
      - "read by the operator, who reads everything, so no line is judged"
    implementation: backend/routes/tickets.py

  - method: POST
    path: /agent-messages/relayed
    description: "別の機械の backend が、 自分のタブから預かった連絡をこの機械のタブへ届ける (= json)"
    request_body:
      type: object
      properties:
        to:            { type: string, description: "宛先のタブの id か名前 (= この機械のタブ)" }
        from_title:    { type: string, description: "送り主のタブの名前" }
        from_session:  { type: string, description: "送り主のタブの id (= 相手の機械での id)" }
        text:          { type: string, description: "本文" }
      required: [to, from_title, from_session, text]
    response:
      type: object
      properties:
        ok:        { type: boolean }
        delivered: { type: boolean }
        to:        { type: string, description: "届け先のタブの id" }
        operator_said: { type: boolean, description: "常に false (= 人の発話は機械を跨がない)" }
        kept:      { type: boolean, description: "宛先が口座の止める線で止まっていて動ける口座が無いので、 起こさずに預かったか" }
      required: [ok, to, operator_said]
    response_kind: json
    auth: peer
    invariants:
      - "受けるのは config の agent_message_peers に書いた相手の接続元からの呼び出しだけ"
      - "封筒の session は <相手の名前>:<送り主のタブの id>、 相手の名前はこの機械の設定の物 (= 届いた中身からは取らない)"
      - "届ける前に、 この機械の agent_message_check を本文に掛ける"
      - "封筒の 1 行目は別の機械からの連絡に固有の文で、 <operator-said> は入れない (= 相手が何を送ってきても)"
      - "相手の設定に accounts が在れば、 その account のタブへだけ届ける"
      - "a receiver that is an API tab is refused with 409 agent_message_api_tab, the same branch as a send from this machine"
    implementation: backend/routes/agent_messages.py

  - method: GET
    path: /agent-messages/tabs
    description: "相手の機械へ、 連絡を受けられるこの機械のタブの一覧を返す"
    response:
      type: object
      properties:
        tabs:
          type: array
          items:
            type: object
            properties:
              id:      { type: string }
              title:   { type: string }
              running: { type: boolean, description: "そのタブへ連絡が届くか (= claude が動いているか、 連絡で起動できる)" }
            required: [id, title, running]
      required: [tabs]
    response_kind: json
    auth: peer
    invariants:
      - "受けるのは config の agent_message_peers に書いた相手の接続元からの呼び出しだけ"
      - "相手の設定の accounts に入らないタブは、 名前も id も返さない"
    implementation: backend/routes/agent_messages.py

  - method: GET
    path: /agent-messages/local-tabs
    description: "この機械の各タブへ連絡が届くかと、 最後の会話 (= tabs list が使う)"
    response:
      type: object
      properties:
        tabs:
          type: array
          items:
            type: object
            properties:
              id:           { type: string }
              reachable:    { type: boolean, description: "claude が動いているか、 連絡で起動できる" }
              conversation: { type: string, nullable: true, description: "最後の会話の claude の session id" }
            required: [id, reachable]
      required: [tabs]
    response_kind: json
    auth: localhost
    invariants:
      - "受けるのは同じ機械の中からの呼び出しだけ (= タブの名前は返さない)"
    implementation: backend/routes/agent_messages.py

  - method: GET
    path: /agent-messages/peers
    description: "設定された相手の機械と、 そこで連絡を受けられるタブの一覧"
    response:
      type: object
      properties:
        peers:
          type: array
          items:
            type: object
            properties:
              name:  { type: string }
              tabs:  { type: array, nullable: true, description: "繋がらない相手は null" }
              error: { type: string, nullable: true }
            required: [name]
      required: [peers]
    response_kind: json
    auth: localhost
    invariants:
      - "相手ごとに 1 回だけ相手の backend を呼ぶ (= GET /agent-messages/tabs)"
    implementation: backend/routes/agent_messages.py

  - method: POST
    path: /pty/{sid}/send-raw-key
    description: "quick-reply button の raw キー 1 打鍵 (= prompt detector の入力待ちに応答)"
    request_body:
      type: object
      required: [key]
      properties:
        key:   { type: string, description: "単一 printable char は literal、 Up/Down/Enter 等は tmux キー名" }
        enter: { type: boolean, description: "key 送信後に Enter を続けるか (= shell prompt 用、 Ink dialog は不要)" }
    response:
      type: object
      properties:
        ok: { type: boolean }
      required: [ok]
    response_kind: json
    auth: tailnet
    invariants:
      - "chat 送信経路 (= /pty/{sid}/send) とは流路分離 (= C-u wipe / 到達確認をしない)"
      - "送信成功時は detector を即 re-poll (= poke_now) して banner を追従させる"
    implementation: backend/terminal/routes.py

  - method: POST
    path: /hooks/event
    description: "claude CLI hook 受け取り (= localhost 限定)"
    request_query:
      reply: { type: string, enum: [text], description: "text = 結果の context だけを素の文で返す (= hook の stdout にそのまま流す形)" }
    request_body:
      type: object
      required: [hook_event_name, session_id]
      properties:
        hook_event_name: { type: string }
        session_id:      { type: string }
        prompt:          { type: string, description: "UserPromptSubmit の発話" }
    response:
      type: object
      properties:
        ok:      { type: boolean }
        context: { type: string, description: "agent へ渡す 1 行 (= 在る時だけ)" }
      required: [ok]
    response_kind: json
    auth: localhost
    invariants:
      - "127.0.0.1 / ::1 以外は 403"
      - "UserPromptSubmit: そのタブの会話がどこかで開いていて、 発話の頭に [voice] の印が無ければ (= 別のタブからの連絡・自動の入れ替え・裏の作業の知らせ)、 context に [voice-open] で始まる 1 行を返す"
      - "reply=text: 応答は text/plain で context の文だけ (= 無ければ空)"
      - "Host header allowlist (= ADR-012 DNS rebinding 防御) で localhost 名指定のみ通す"
    implementation: backend/routes/hooks.py

  - method: GET
    path: /push/vapid-public-key
    description: "Web Push 用 VAPID 公開鍵取得"
    response:
      type: object
      properties:
        public_key: { type: string }
      required: [public_key]
    response_kind: json
    auth: tailnet
    invariants:
      - "鍵は backend/secrets/vapid.json (= cli/gen_vapid.py で生成)"
    implementation: backend/routes/files.py

  - method: POST
    path: /push/subscribe
    description: "Web Push subscription 登録"
    request_body:
      type: object
      required: [subscription]
      properties:
        subscription:
          type: object
          description: "PushSubscription dict (= endpoint / keys / expirationTime)"
    response:
      type: object
      properties:
        ok: { type: boolean }
      required: [ok]
    response_kind: json
    auth: tailnet
    invariants:
      - "endpoint 単位で dedup"
      - "永続化先 = data/push_subscriptions.json"
    implementation: backend/push/push.py

  - method: POST
    path: /push/unsubscribe
    description: "Web Push subscription 解除"
    request_body:
      type: object
      required: [endpoint]
      properties:
        endpoint: { type: string }
    response:
      type: object
      properties:
        ok: { type: boolean }
      required: [ok]
    response_kind: json
    auth: tailnet
    invariants:
      - "存在しない endpoint も 200 (= 冪等)"
    implementation: backend/push/push.py

  - method: POST
    path: /notifications/read-all
    description: "未読カウンタを 0 にリセット"
    response:
      type: object
      properties:
        ok: { type: boolean }
      required: [ok]
    response_kind: json
    auth: tailnet
    invariants:
      - "app badge (= service worker 経由) もクリア"
    implementation: backend/routes/sessions.py

  - method: POST
    path: /notifications/sync
    description: "未読カウント同期 (= badge 用)"
    response:
      type: object
      properties:
        unread_count: { type: integer }
      required: [unread_count]
    response_kind: json
    auth: tailnet
    invariants:
      - "全 session 横断の未読合計"
    implementation: backend/routes/sessions.py

  - method: POST
    path: /log/sw
    description: "Service Worker からの構造化 log 受信"
    request_body:
      type: object
      required: [event]
      properties:
        event: { type: string }
    response:
      type: object
      properties:
        ok: { type: boolean }
      required: [ok]
    response_kind: json
    auth: tailnet
    invariants:
      - "backend/observability/structured_log.py に書き込み"
      - "frontend ↔ backend log を corr_id で結合 (= ADR-012)"
    implementation: backend/main.py

  - method: GET
    path: /jsonl/_debug/bindings
    description: "debug: watcher binding 一覧"
    response:
      type: object
      properties: {}
      additionalProperties:
        type: object
        properties:
          jsonl_path: { type: string }
          confirmed:  { type: boolean }
        required: [jsonl_path, confirmed]
    response_kind: json
    auth: tailnet
    invariants:
      - "debug 用、 通常 UI からは叩かない"
      - "key = sid"
    implementation: backend/jsonl/routes.py

  - method: GET
    path: /stream/unified
    description: "統合 SSE (= jsonl / status / overview / subagents / sys を 1 接続に多重化、 2026-07-14 電力効率工事)"
    response_kind: sse
    auth: tailnet
    invariants:
      - "frame は data 行 JSON の channel envelope: {ch: sys|jsonl|status|overview|subagents, ...}"
      - "jsonl channel は query `jsonl=sid:off,...` / control op で購読宣言した sid のみ配信 (= fan-out 遮断)。 the sids that can be subscribed are the Claude tabs and the API tabs (= the table of backend/api_tabs/)"
      - "the status channel is sid → row. A Claude tab's row has model / ctx_pct / 5h / 7d and the rest. An API tab's row is of another kind and holds only { kind: api, context_tokens, spend } (= spend is its wallet's spend this month, null when there is no figure), never a Claude row with empty fields, so the bar draws no 5h, 7d or NaN%"
      - "an API tab's events (jsonl channel) and its context_tokens (overview) follow the rows appended to its record file, looked at every 0.5 s. Rows already there when the backend started are not streamed; a file that appears later is read from 0; a file that got shorter, or vanished, is read from 0 again and history_refetch is sent"
      - "jsonl frame = {ch, pos, ev}。 ev は sse-events.yaml の event そのまま (= schema 変更なし)、 pos は行末実 byte 位置 (= null は ephemeral)"
      - "接続時 warmup (= PTY ensure) + replay は購読 sid のみ (= 全 sid sweep なし)"
      - "replay の offset は GET /jsonl/history の since と同じ窓で読む。 offset の直後の行から欠けずに流せなかった時は、 その sid の frame の先頭に history_refetch event を 1 つ載せる (= offset を持たない購読には載せない)"
      - "query `conn` (= client 生成 id) 必須、 `view` で視認中 sid を同時申告可"
      - "keep-alive は {ch:sys,_hb:1} を 25s 間隔"
      - "切断で views 登録 / conn 登録が自動消滅 (= /views/ws の TCP FIN と等価の stale-free)"
    implementation: backend/routes/unified_stream.py

  - method: POST
    path: /stream/unified/{conn}/control
    description: "統合 stream の上り制御 (= 購読差替 / view 申告 / 会話の申告 / stop / subagents 切替)"
    request_body:
      type: object
      required: [op]
      properties:
        op:   { enum: [jsonl, view, voice, stop, subagents] }
        sid:  { type: string, nullable: true }
        sids: { type: array }
    response:
      type: object
      properties:
        ok: { type: boolean }
        subscribed: { type: array }
        voice: { type: array }
    response_kind: json
    auth: tailnet
    invariants:
      - "op=jsonl: sids=[{sid,from}] で購読 set 差替、 追加 sid は PTY ensure + from からの差分 replay を同一接続へ流す"
      - "op=view: views_by_conn 更新 (= 通知抑制判定)、 sid=null で解除"
      - "op=voice: sids=[sid] でこの画面が会話 (= 🔊 か 🎙) を開いているタブを差替 (= voices_by_conn。 [] で解除、 切断で消える)。 声で聞いている印の判定に使う"
      - "op=stop: user_stopped 権威記録 + busy 強制 false (= 旧 /views/ws stop メッセージと同義)"
      - "op=subagents: watch 対象 sid 切替 (= null で停止)、 対象 1 接続 1 sid"
      - "不明 conn は 404 (= 接続が先、 制御が後)"
    implementation: backend/routes/unified_stream.py

  - method: POST
    path: /device/ops
    description: "この Mac の命令 (= cpc device) が、 iPhone の app に操作を 1 つ頼む (= json)"
    request_body:
      type: object
      properties:
        op:        { type: string, description: "<種類>.<操作> (= app の一覧の名前)" }
        args:      { type: object, description: "操作の引数 (= 一覧の params に従う)" }
        timeout_s: { type: number, description: "答えを待つ秒 (= 省けば操作が名乗る長さ、 名乗らなければ 30)" }
      required: [op]
    response:
      type: object
      properties:
        ok:     { type: boolean }
        result: { description: "app の答え (= 大きい答えは files に path の並びで入る)" }
      required: [ok]
    response_kind: json
    auth: localhost
    invariants:
      - "app がつながっていなければ 503、 一覧に無い操作は 404 (= detail に known の並び)、 時間切れは 504、 app ができなかったら 502"
      - "一覧に無い操作は app へ送らない"
      - "答えに付いた file は data/device-files/ に書き、 答えには path を返す (= app が付けた名前の / や .. は落とす)"
    implementation: backend/routes/device.py

  - method: POST
    path: /device/screen
    description: "iPhone の app の画面の配信が 1 枚送る (= JPEG。 最後の 1 枚だけを持つ)"
    request_body:
      type: string
      description: "image/jpeg の本体 (= 5MB まで)"
    response:
      type: object
      properties:
        bytes: { type: integer }
      required: [bytes]
    response_kind: json
    auth: tailnet
    invariants:
      - "JPEG でない物 (= 頭が FF D8 でない) と 5MB を超える物は 400"
      - "data/device-files/screen.jpg を置き換える"
    implementation: backend/routes/device.py

  - method: POST
    path: /device/screen/state
    description: "画面の配信の始まりと終わり"
    request_body:
      type: object
      required: [live]
      properties:
        live: { type: boolean }
    response:
      type: object
      properties:
        live: { type: boolean }
      required: [live]
    response_kind: json
    auth: tailnet
    invariants:
      - "終わりの知らせが届かずに切れても、 最後の 1 枚が 5 秒より古ければ配信していない扱い (= GET /device/screen の live)"
    implementation: backend/routes/device.py

  - method: GET
    path: /device/screen/settings
    description: "画面の配信の仕方 (= app の配信が始まる時に受け取る)"
    response:
      type: object
      properties:
        interval_s: { type: number, description: "1 枚を送る間隔 (秒)" }
        max_side:   { type: integer, description: "長辺の上限 (px)" }
        quality:    { type: number, description: "JPEG の質 (= 0 より大きく 1 以下)" }
      required: [interval_s, max_side, quality]
    response_kind: json
    auth: tailnet
    invariants:
      - "backend/config.json の device_screen を既定に重ねた物 (= 型か範囲が違う値は既定のまま)"
    implementation: backend/routes/device.py

  - method: GET
    path: /device/screen
    description: "iPhone の画面の最後の 1 枚の在処と、 配信しているか (= cpc device screen)"
    response:
      type: object
      properties:
        live:  { type: boolean, description: "配信中で、 最後の 1 枚が 5 秒より新しい" }
        path:  { type: string, nullable: true }
        at:    { type: number, nullable: true, description: "最後の 1 枚の時刻 (= unix 秒)" }
        age_s: { type: number, nullable: true }
        bytes: { type: integer, nullable: true }
      required: [live, path]
    response_kind: json
    auth: localhost
    invariants:
      - "まだ 1 枚も届いていない時は path / at / age_s / bytes が null"
    implementation: backend/routes/device.py

  - method: GET
    path: /device/catalog
    description: "iPhone の app がつながっているかと、 できる操作の一覧 (= 居ない時は最後に受けた一覧)"
    response:
      type: object
      properties:
        connected: { type: boolean }
        device:    { type: string }
        app:       { type: string, description: "app の版" }
        since:     { type: number, description: "つないだ時刻 (= unix 秒)" }
        catalog:   { type: array, description: "操作の並び (= name / kind / summary / params / timeout_s / foreground)" }
      required: [connected, catalog]
    response_kind: json
    auth: localhost
    invariants:
      - "一覧の真値は app の中 (= hello で受けた物を data/device_catalog.json に控える)"
    implementation: backend/routes/device.py
