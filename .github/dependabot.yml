# Dependabot config.
#
# Why this file exists: without it Dependabot opens against the default branch,
# which is `main`. This repository promotes `develop` to `main` as a whole tree,
# so a bump landing on `main` alone breaks the invariant that the two carry the
# same tree, and the PR has to be closed by hand instead of merged. Pointing
# Dependabot at `develop` puts the bump where every other change enters.
#
# `open-pull-requests-limit: 0` turns off routine version bumps while leaving
# security updates on. That is deliberate: the only thing wrong before was the
# branch they landed on, not how many arrived. With the limit at a positive
# number Dependabot also opens scheduled "everything to latest" PRs — the first
# run produced one with 17 frontend packages and one with 9 backend packages,
# which is a review burden nobody asked for and, as js-yaml 5 showed, can carry
# breaking changes.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    target-branch: develop
    schedule:
      interval: monthly
    open-pull-requests-limit: 0

  - package-ecosystem: npm
    directory: /contracts
    target-branch: develop
    schedule:
      interval: monthly
    open-pull-requests-limit: 0

  - package-ecosystem: pip
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    open-pull-requests-limit: 0

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
