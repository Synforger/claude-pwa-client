name: CI

# Mirror of the local gate suite — the checks themselves live in the
# Taskfile / .tooling and run offline; this workflow only gives GitHub
# a trigger to run the same `task ci` on pull requests, so external
# contributors get a status check without owning the guard machinery.
#
# Visibility guard: public-repo runner minutes are free; on a private
# repository this workflow refuses to run so it can never consume the
# plan's minute quota. Local gates remain the source of truth there.

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # staledocs trailer acks resolve against history; a shallow clone blinds the coherence gate
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Install go-task
        run: sudo sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b /usr/local/bin
      - name: Install backend deps
        run: python3 -m pip install -r backend/requirements.txt && python3 -m pip install pytest flake8
      - name: Install frontend deps
        run: cd frontend && npm ci
      # contracts は独立した npm workspace で、 その検査 (= schema の json-schema
      # 検証) が ajv を要る。 frontend の依存だけ入れると `task ci` の
      # contracts:check が ERR_MODULE_NOT_FOUND で落ちる。
      - name: Install contracts deps
        run: cd contracts && npm ci
      - name: Run the local gate suite
        run: task ci
