[pytest]
# Every run names its ten slowest tests, and a test that runs past `timeout` seconds fails instead of holding the whole
# run. The limit is three times the slowest test of a normal run: 2.55 s (voice_call's idle-watch test) on 2026-11-21.
# Measure again with the durations this prints when the slowest test changes.
addopts = --strict-markers --durations=10
timeout = 8
testpaths = backend/tests
